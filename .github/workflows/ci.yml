name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish as a release (for example v0.2.0)
        required: false

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG != '' && format('refs/tags/{0}', env.TAG) || '' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tag matches package.json
        if: env.TAG != ''
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${TAG}" != "v${version}" ]; then
            echo "tag ${TAG} does not match package.json version ${version}" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Package
        run: |
          if [ -n "${TAG}" ]; then
            node scripts/package.mjs "dist/gitea-dev-${TAG}.tar.gz"
          else
            npm run package
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: gitea-dev
          path: |
            dist/gitea-dev-*.tar.gz
            dist/gitea-dev-*.tar.gz.sha256
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gitea-dev
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "${TAG}" in *-*) flags="--prerelease" ;; esac
          gh release create "${TAG}" \
            "dist/gitea-dev-${TAG}.tar.gz" \
            "dist/gitea-dev-${TAG}.tar.gz.sha256" \
            --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes --title "${TAG}" ${flags}
